# Gera a animação da "cobrinha" comendo o gráfico de contribuições e
# publica os SVGs na branch `output`, usada pelo README.
name: Animação de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 (Brasília)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FACC15&color_dots=#161b22,#3d3200,#7a6200,#c49c00,#FACC15
            dist/snake-light.svg?color_snake=#A16207&color_dots=#ebedf0,#fef3c7,#fde68a,#facc15,#ca8a04

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
