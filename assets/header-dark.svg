<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Dário Jr — Desenvolvedor Full Stack">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050507" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#050507" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .a1 { animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
      .a2 { animation: rise .9s .15s cubic-bezier(.16,1,.3,1) both; }
      .a3 { animation: rise .9s .3s cubic-bezier(.16,1,.3,1) both; }
      .dot { animation: blink 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .a1, .a2, .a3, .dot { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="#050507"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- marca -->
  <g transform="translate(1032 56)">
    <rect width="112" height="112" rx="30" fill="#FACC15"/>
    <text x="56" y="72" text-anchor="middle" class="t" font-size="44" font-weight="800" fill="#0B0A00" letter-spacing="-2">DJ</text>
  </g>

  <g class="a1">
    <rect x="64" y="58" width="306" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle class="dot" cx="86" cy="75" r="5" fill="#28C840"/>
    <text x="100" y="80.5" class="t" font-size="15" fill="#A1A1A6">Disponível para novas oportunidades</text>
  </g>

  <text x="60" y="176" class="t a2" font-size="84" font-weight="800" fill="#F5F5F7" letter-spacing="-4">Dário Jr<tspan fill="#FACC15">.</tspan></text>

  <g class="a3">
    <text x="64" y="222" class="t" font-size="28" font-weight="500" fill="#A1A1A6" letter-spacing="-0.5">Desenvolvedor Full Stack</text>
    <text x="64" y="266" class="m" font-size="16" fill="#6E6E73">
      <tspan fill="#FACC15">▸</tspan> São Paulo, SP · Remoto · 4+ anos de experiência
    </text>
  </g>
</svg>
